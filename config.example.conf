# ============ 配置文件模板 ============
# 复制为 config.conf 后填写真实信息；config.conf 不要提交到 GitHub。

ACCOUNT_ID="你的Account_ID"
API_TOKEN="你的API_Token"
WORKER_NAME="square"
ENV_VAR_NAME="proxyip"

# 优选地区（IATA 机场码，逗号分隔；留空=不限制）
CFCOLO="TPE,KHH"

N=100
DN=5
TL=300
USE_PUBLIC_PROXY_IP=true
PROXY_SOURCE1="https://raw.githubusercontent.com/LancelotRar/best-cf-ips/main/best-cf-ip-collected.txt"
PROXY_SOURCE2="https://raw.githubusercontent.com/LancelotRar/best-cf-ips/main/best-cf-ip-scanned-top100.txt"

RESULT="result.csv"
IP_FILE="ip.txt"
PROXY_IP_FILE="proxy_ips.txt"
CURL_TIMEOUT=30
CURL_RETRIES=2
LOCK_DIR=".update.lock"
# 首次验证配置时可设为 true，只测速、不调用 Cloudflare API。
DRY_RUN=false
