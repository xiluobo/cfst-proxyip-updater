# ============ 配置文件模板 ============
# 复制为 config.conf 后填写真实信息
# cp config.example.conf config.conf

# Cloudflare 账号 ID（在 Workers 后台 URL 里可见）
ACCOUNT_ID="你的Account_ID"

# API Token（需要 Workers Scripts Edit 权限）
# 切勿将含真实 Token 的 config.conf 提交到 GitHub
API_TOKEN="你的API_Token"

# Worker 名称
WORKER_NAME="square"

# 要更新的环境变量名
ENV_VAR_NAME="proxyip"

# 优选地区（IATA 机场码，逗号分隔，留空=不限制）
# 台湾: TPE,KHH
# 香港: HKG
# 日本: NRT,TYO,KIX
# 新加坡: SIN
# 美西: LAX,SJC,SEA
CFCOLO="TPE,KHH"

# 测速参数
N=100
DN=5
TL=300
SL=0

# 是否拉取公开反代/优选 IP
USE_PUBLIC_PROXY_IP=true

# 公开源
PROXY_SOURCE1="https://raw.githubusercontent.com/LancelotRar/best-cf-ips/main/best-cf-ip-collected.txt"
PROXY_SOURCE2="https://raw.githubusercontent.com/LancelotRar/best-cf-ips/main/best-cf-ip-scanned-top100.txt"

RESULT="result.csv"
IP_FILE="ip.txt"
PROXY_IP_FILE="proxy_ips.txt"
